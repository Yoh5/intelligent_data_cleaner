name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # Dépendances réellement utilisées par les tests (on évite ydata-profiling,
        # lourd et non requis par le profiler/les services).
        run: |
          python -m pip install --upgrade pip
          # pyarrow : le livrable Parquet de la passe sous contrat.
          # scikit-learn : sans lui, les 14 tests de la chaine de preparation
          # (dont le test anti-fuite, qui EXECUTE le script) se sautent en silence.
          pip install pandas numpy openpyxl pyarrow fastapi "pydantic>=2" pydantic-settings \
                      python-multipart httpx openai pytest scikit-learn
      - name: Run tests
        run: pytest tests/ -q
